name: Portfolio Compiler and Showcase Publisher

on:
  schedule:
    - cron: '0 10 * * *' # 05:00 AM CDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Portfolio Compiler
        run: |
          python scripts/build_portfolio.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add PORTFOLIO.md
          git commit -m "docs(portfolio): dynamic update to academic showcase" || echo "No changes to commit"
          git push origin HEAD || echo "No changes to push"
