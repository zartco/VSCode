name: Portfolio Compiler

on:
  schedule:
    - cron: '0 10 * * *' # 05:00 AM CDT

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install pyyaml

    - name: Run portfolio compiler
      run: python scripts/build_portfolio.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add PORTFOLIO.md
        git commit -m "docs(portfolio): dynamic update to academic showcase" || echo "No changes to commit"
        git push
