name: Portfolio Compiler

on:
  schedule:
    - cron: '0 10 * * *' # 05:00 AM CDT

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Run portfolio builder
        run: python scripts/build_portfolio.py
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add PORTFOLIO.md
          git commit -m "docs(portfolio): dynamic update to academic showcase" || echo "No changes to commit"
          git push
