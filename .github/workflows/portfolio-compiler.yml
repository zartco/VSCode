name: Portfolio Compiler and Showcase Publisher

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Build Script
        run: python scripts/build_portfolio.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add PORTFOLIO.md
          # Only commit and push if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs(portfolio): dynamic update to academic showcase" && git push)