name: Portfolio Compiler

on:
  schedule:
    - cron: '0 10 * * *' # 05:00 AM CDT is 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run compilation script
        run: python scripts/build_portfolio.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add PORTFOLIO.md
          git commit -m "docs(portfolio): dynamic update to academic showcase" || echo "No changes to commit"
          git push
