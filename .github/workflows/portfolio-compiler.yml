name: Portfolio Compiler

on:
  schedule:
    - cron: '0 10 * * *' # 05:00 AM CDT is 10:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install pyyaml

    - name: Run compiler script
      run: |
        python scripts/build_portfolio.py

    - name: Commit changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add PORTFOLIO.md
        git commit -m "docs(portfolio): dynamic update to academic showcase" || echo "No changes to commit"
        git push || true
