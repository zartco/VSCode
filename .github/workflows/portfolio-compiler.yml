name: Portfolio Compiler and Showcase Publisher

on:
  schedule:
    - cron: '0 10 * * *' # 05:00 AM CDT is 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build Portfolio
        run: python scripts/build_portfolio.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git add PORTFOLIO.md
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "docs(portfolio): dynamic update to academic showcase"
            git push
          fi
